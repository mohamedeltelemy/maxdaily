<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAX DAILY — Private Owner Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #1A120D;
      --espresso-deep: #110B08;
      --charcoal: #241912;
      --cream: #F4E9DC;
      --cream-soft: #FAF4EC;
      --warm-beige: #E9DDCD;
      --gold: #D9AE7B;
      --gold-deep: #B5854B;
      --coffee-brown: #77583C;
      --border-gold: rgba(217, 174, 123, 0.32);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--espresso-deep);
      color: var(--cream);
      min-height: 100vh;
    }

    /* Top Bar */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: var(--espresso);
      border-bottom: 1.5px solid var(--gold);
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .admin-badge {
      padding: 4px 10px;
      background: rgba(217, 174, 123, 0.16);
      border: 1px solid var(--gold);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    /* Main Split Studio Layout */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 28px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    @media (max-width: 960px) {
      .studio-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--charcoal);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-gold);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--warm-beige);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-gold);
      background: var(--espresso-deep);
      color: var(--cream);
      font-family: inherit;
      font-size: 12.5px;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      padding: 13px 20px;
      border-radius: 12px;
      border: 1.5px solid var(--gold);
      background: var(--gold);
      color: var(--espresso-deep);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn.secondary {
      background: transparent;
      color: var(--gold);
    }

    /* Live Mobile Preview Frame */
    .phone-mockup {
      position: sticky;
      top: 24px;
      width: 390px;
      height: 760px;
      margin: 0 auto;
      border: 10px solid #2C1E15;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      background: var(--cream);
    }

    .phone-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status-toast {
      display: none;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid #4ADE80;
      color: #4ADE80;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-brand">
      <strong style="font-size:17px;letter-spacing:0.14em;">MAX DAILY</strong>
      <span class="admin-badge">PRIVATE OWNER CONTROL PANEL</span>
    </div>
    <a href="https://maxdailycafe.github.io/MaxDialyDashboard/" target="_blank" style="color:var(--gold);font-size:12px;font-weight:700;text-decoration:none;">Open Public Customer Hub ↗</a>
  </header>

  <main class="studio-grid">
    <!-- Left Column: Controls -->
    <div>
      <div class="panel-card">
        <div class="panel-title">1. Website, Menu &amp; Google Rating</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Official Website URL</label>
            <input type="text" id="cfg-website" value="https://maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Google Star Rating</label>
            <input type="text" id="cfg-rating" value="4.9" oninput="syncPreview()" />
          </div>
          <div class="form-group full">
            <label>Google Review Link (Direct 5-Star Review Page)</label>
            <input type="text" id="cfg-review-url" value="https://search.google.com/local/writereview?placeid=MAX_DAILY_PLACE_ID" oninput="syncPreview()" />
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">2. Social Media Channels (Instagram, TikTok, Facebook)</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Instagram Handle</label>
            <input type="text" id="cfg-ig-handle" value="@maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Instagram Link</label>
            <input type="text" id="cfg-ig-url" value="https://instagram.com/maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>TikTok Handle</label>
            <input type="text" id="cfg-tt-handle" value="@maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>TikTok Link</label>
            <input type="text" id="cfg-tt-url" value="https://tiktok.com/@maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Facebook Handle</label>
            <input type="text" id="cfg-fb-handle" value="/maxdaily.coffee" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Facebook Link</label>
            <input type="text" id="cfg-fb-url" value="https://facebook.com/maxdaily.coffee" oninput="syncPreview()" />
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">3. Footer Contact &amp; Location</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>Branch Address</label>
            <input type="text" id="cfg-address" value="Specialty Coffee District, Main Boulevard, Cairo, Egypt" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="cfg-phone" value="+20 100 000 0000" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>WhatsApp Link</label>
            <input type="text" id="cfg-whatsapp" value="https://wa.me/201000000000" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Opening Hours</label>
            <input type="text" id="cfg-hours" value="Open Daily: 07:00 AM – 12:00 AM" oninput="syncPreview()" />
          </div>
          <div class="form-group">
            <label>Google Maps Link</label>
            <input type="text" id="cfg-maps" value="https://maps.google.com/?q=MAX+DAILY+Specialty+Coffee+and+Bakery" oninput="syncPreview()" />
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">4. Publish Live to Customer QR Hub (Remote Domain Push)</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Target GitHub Repo (owner/repo)</label>
            <input type="text" id="gh-repo" value="MaxDailyCafe/MaxDialyDashboard" />
          </div>
          <div class="form-group">
            <label>Owner Access Token (Saved Only in Your Browser)</label>
            <input type="password" id="gh-token" placeholder="ghp_..." />
          </div>
        </div>
        <div class="btn-bar">
          <button class="btn" onclick="publishToGitHub()">🚀 Publish Changes Live Now</button>
          <button class="btn secondary" onclick="downloadConfig()">⬇ Download hub_config.json</button>
        </div>
        <div id="status-msg" class="status-toast"></div>
      </div>
    </div>

    <!-- Right Column: Live Customer Hub Preview -->
    <div>
      <div class="phone-mockup">
        <iframe id="preview-frame" class="phone-iframe" src="./index.html"></iframe>
      </div>
    </div>
  </main>

  <script>
    let CURRENT_CONFIG = null;

    fetch('./hub_config.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        CURRENT_CONFIG = data;
        document.getElementById('cfg-website').value = (data.websites && data.websites[0]) ? data.websites[0].url : 'https://maxdaily.coffee';
        document.getElementById('cfg-rating').value = data.google_review.rating;
        document.getElementById('cfg-review-url').value = data.google_review.review_url;
        document.getElementById('cfg-ig-handle').value = data.social_media[0].handle;
        document.getElementById('cfg-ig-url').value = data.social_media[0].url;
        document.getElementById('cfg-tt-handle').value = data.social_media[1].handle;
        document.getElementById('cfg-tt-url').value = data.social_media[1].url;
        document.getElementById('cfg-fb-handle').value = data.social_media[2].handle;
        document.getElementById('cfg-fb-url').value = data.social_media[2].url;
        document.getElementById('cfg-address').value = data.location.address_line_1 + ', ' + data.location.address_line_2;
        document.getElementById('cfg-phone').value = data.location.phone;
        document.getElementById('cfg-whatsapp').value = data.location.whatsapp;
        document.getElementById('cfg-hours').value = data.location.hours;
        document.getElementById('cfg-maps').value = data.location.google_maps_url;
      })
      .catch(() => {});

    function buildUpdatedConfig() {
      const cfg = CURRENT_CONFIG || {
        brand: { name: "MAX DAILY", subtitle: "SPECIALTY COFFEE & BAKERY", slogan: "A DAILY DOSE OF POSITIVITY" },
        google_review: {},
        websites: [{ id: "official_website", title: "OFFICIAL WEBSITE", url: "" }],
        social_media: [
          { id: "instagram", platform: "Instagram", icon: "instagram" },
          { id: "tiktok", platform: "TikTok", icon: "tiktok" },
          { id: "facebook", platform: "Facebook", icon: "facebook" }
        ],
        location: {},
        menu_categories: []
      };

      cfg.websites[0].url = document.getElementById('cfg-website').value.trim();
      cfg.google_review.rating = document.getElementById('cfg-rating').value.trim();
      cfg.google_review.review_url = document.getElementById('cfg-review-url').value.trim();

      cfg.social_media[0].handle = document.getElementById('cfg-ig-handle').value.trim();
      cfg.social_media[0].url = document.getElementById('cfg-ig-url').value.trim();
      cfg.social_media[1].handle = document.getElementById('cfg-tt-handle').value.trim();
      cfg.social_media[1].url = document.getElementById('cfg-tt-url').value.trim();
      cfg.social_media[2].handle = document.getElementById('cfg-fb-handle').value.trim();
      cfg.social_media[2].url = document.getElementById('cfg-fb-url').value.trim();

      const addrParts = document.getElementById('cfg-address').value.split(',');
      cfg.location.address_line_1 = addrParts[0]?.trim() || '';
      cfg.location.address_line_2 = addrParts.slice(1).join(',').trim() || '';
      cfg.location.phone = document.getElementById('cfg-phone').value.trim();
      cfg.location.whatsapp = document.getElementById('cfg-whatsapp').value.trim();
      cfg.location.hours = document.getElementById('cfg-hours').value.trim();
      cfg.location.google_maps_url = document.getElementById('cfg-maps').value.trim();

      return cfg;
    }

    function syncPreview() {
      const cfg = buildUpdatedConfig();
      const frame = document.getElementById('preview-frame');
      if (frame && frame.contentWindow && frame.contentWindow.renderHub) {
        frame.contentWindow.HUB_DATA = cfg;
        frame.contentWindow.renderHub();
      }
    }

    function downloadConfig() {
      const cfg = buildUpdatedConfig();
      const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hub_config.json';
      a.click();
    }

    async function publishToGitHub() {
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();
      const statusEl = document.getElementById('status-msg');
      if (!token) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Please enter your Owner Access Token (or click Download hub_config.json).';
        return;
      }
      statusEl.style.display = 'block';
      statusEl.textContent = 'Publishing live to ' + repo + '...';
      try {
        const cfg = buildUpdatedConfig();
        const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/hub_config.json`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const fileData = getRes.ok ? await getRes.json() : {};
        const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(cfg, null, 2))));
        const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/hub_config.json`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update MAX DAILY Hub links via Owner Admin Panel',
            content: contentB64,
            sha: fileData.sha
          })
        });
        if (putRes.ok) {
          statusEl.textContent = '✓ Successfully published! Your live customer QR hub is updated.';
        } else {
          statusEl.textContent = 'Error publishing: ' + putRes.statusText;
        }
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
